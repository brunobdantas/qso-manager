name: Build · Android Preview

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          test -n "$ANDROID_HOME"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Mobile core tests
        working-directory: mobile
        run: npm test

      - name: Verify product capability contract
        run: python scripts/verify_product_parity.py

      - name: Production metadata gate
        run: python scripts/verify_production.py

      - name: Build mobile web bundle
        working-directory: mobile
        run: npm run build

      - name: Generate Android project
        working-directory: mobile
        run: |
          npx cap add android
          npx cap sync android

      - name: Set Android version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("mobile/android/app/build.gradle")
          text = p.read_text()
          text = text.replace("versionCode 1", "versionCode 10000")
          text = text.replace('versionName "1.0"', 'versionName "1.0.0"')
          p.write_text(text)
          PY

      - name: Build installable APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK="mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          mkdir -p dist-android
          cp "$APK" "dist-android/PU2BRU-QSO-Manager-v1.0.0-Android-preview.apk"
          ls -lh dist-android/PU2BRU-QSO-Manager-v1.0.0-Android-preview.apk
          sha256sum dist-android/PU2BRU-QSO-Manager-v1.0.0-Android-preview.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: PU2BRU-QSO-Manager-Android
          path: dist-android/PU2BRU-QSO-Manager-v1.0.0-Android-preview.apk
          if-no-files-found: error
          retention-days: 30
