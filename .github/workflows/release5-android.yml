name: Build · Android Preview

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          test -n "$ANDROID_HOME"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Mobile core tests
        working-directory: mobile
        run: npm test

      - name: Verify product capability contract
        run: python scripts/verify_product_parity.py

      - name: Production metadata gate
        run: python scripts/verify_production.py

      - name: Build mobile web bundle
        working-directory: mobile
        run: npm run build

      - name: Generate Android project
        working-directory: mobile
        run: |
          npx cap add android
          npx cap sync android

      - name: Resolve mobile version
        shell: bash
        run: |
          VERSION=$(node -p "require('./mobile/package.json').version")
          echo "MOBILE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Set Android version
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          version = json.loads(Path("mobile/package.json").read_text())["version"]
          major, minor, patch = (int(part) for part in version.split("."))
          version_code = major * 10000 + minor * 100 + patch

          p = Path("mobile/android/app/build.gradle")
          text = p.read_text()
          text = text.replace("versionCode 1", f"versionCode {version_code}")
          text = text.replace('versionName "1.0"', f'versionName "{version}"')
          p.write_text(text)
          PY

      - name: Build installable APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK="mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          mkdir -p dist-android
          OUTPUT="dist-android/PU2BRU-QSO-Manager-v${MOBILE_VERSION}-Android-preview.apk"
          cp "$APK" "$OUTPUT"
          ls -lh "$OUTPUT"
          sha256sum "$OUTPUT"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: PU2BRU-QSO-Manager-Android
          path: dist-android/PU2BRU-QSO-Manager-v${{ env.MOBILE_VERSION }}-Android-preview.apk
          if-no-files-found: error
          retention-days: 30
