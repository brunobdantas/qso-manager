name: Release 4 Windows Installer

on:
  push:
    branches: [release4-windows-installer, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install backend and build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install pyinstaller==6.11.1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Backend regression suite
        run: python -m pytest backend/tests -q

      - name: Release 2 verification
        run: python scripts/verify_release2.py

      - name: Release 3 verification
        run: python scripts/verify_release3.py

      - name: Build Windows application bundle
        run: python -m PyInstaller installer/qso_manager.spec --noconfirm --clean

      - name: Bundle Microsoft runtime DLLs app-local
        shell: pwsh
        run: |
          $bundle = Resolve-Path ".\dist\PU2BRU-QSO-Manager"
          $internal = Join-Path $bundle "_internal"
          if (-not (Test-Path $internal)) { New-Item -ItemType Directory -Path $internal | Out-Null }

          $runtimeNames = @(
            "vcruntime140.dll",
            "vcruntime140_1.dll",
            "msvcp140.dll",
            "msvcp140_1.dll",
            "msvcp140_2.dll",
            "concrt140.dll"
          )
          $copied = @()
          foreach ($name in $runtimeNames) {
            $source = Join-Path $env:WINDIR "System32\$name"
            if (Test-Path $source) {
              Copy-Item $source (Join-Path $bundle $name) -Force
              Copy-Item $source (Join-Path $internal $name) -Force
              $copied += $name
            }
          }
          if (-not ($copied -contains "vcruntime140.dll")) {
            throw "vcruntime140.dll was not found on the build runner"
          }
          Write-Host "Bundled runtimes: $($copied -join ', ')"

      - name: Verify packaged runtime layout
        shell: pwsh
        run: |
          $exe = ".\dist\PU2BRU-QSO-Manager\PU2BRU-QSO-Manager.exe"
          $pythonDll = ".\dist\PU2BRU-QSO-Manager\_internal\python312.dll"
          $runtime = ".\dist\PU2BRU-QSO-Manager\_internal\vcruntime140.dll"
          if (-not (Test-Path $exe)) { throw "Packaged executable not found" }
          if (-not (Test-Path $pythonDll)) { throw "python312.dll not found in onedir bundle" }
          if (-not (Test-Path $runtime)) { throw "vcruntime140.dll not found beside Python runtime" }

      - name: Self-test packaged executable
        shell: pwsh
        env:
          QSO_MANAGER_DATA_DIR: ${{ runner.temp }}\pu2bru-self-test
        run: |
          $process = Start-Process -FilePath ".\dist\PU2BRU-QSO-Manager\PU2BRU-QSO-Manager.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged self-test failed with exit code $($process.ExitCode)" }
          $db = Join-Path $env:QSO_MANAGER_DATA_DIR "data\qso_manager.db"
          if (-not (Test-Path $db)) { throw "Packaged database was not created in persistent data directory" }

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "installer\qso-manager.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path ".\dist-installer\PU2BRU-QSO-Manager-Setup.exe")) {
            throw "Installer output not found"
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: PU2BRU-QSO-Manager-Windows-Setup
          path: dist-installer/PU2BRU-QSO-Manager-Setup.exe
          if-no-files-found: error
          retention-days: 30
