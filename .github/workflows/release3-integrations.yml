name: Release 3 Integrations

on:
  push:
    branches: [release3-integrations]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  final-system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Release 1 regression suite
        run: python acceptance/run_release1_acceptance.py
      - name: Release 2 local app verification
        run: python scripts/verify_release2.py
      - name: Release 3 integration safety tests
        run: python -m pytest backend/tests/test_integrations.py -v
      - name: Release 3 final verification
        run: python scripts/verify_release3.py
